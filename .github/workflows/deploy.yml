name: CI/CD Pipeline - Task Manager

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # PostgreSQL service for tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: taskmanager_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Stage 1 - Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Stage 2 - Setup Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Stage 3 - Build with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Stage 4 - Run Tests with PostgreSQL
      - name: Run Tests
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskmanager_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      # Stage 5 - Build Docker Image
      - name: Build Docker Image
        run: docker build -t stamrakar7/taskmanager:latest .

      # Stage 6 - Push to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push to Docker Hub
        run: docker push stamrakar7/taskmanager:latest

      # Stage 7 - Deploy to AWS EC2
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/taskmanager
            docker pull stamrakar7/taskmanager:latest
            docker-compose down || true
            docker-compose up -d
            echo "✅ Deployed successfully!"
